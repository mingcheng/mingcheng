name: Prek checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install tools with mise
        uses: jdx/mise-action@v5
      - name: Run repository checks
        run: mise run lint
